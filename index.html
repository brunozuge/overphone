
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERPHONE | Calculadora</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #080808;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #151515;
    padding: 26px;
    border-radius: 18px;
    border: 1px solid #303030;
    box-shadow: 0 10px 40px #000;
}

.logo {
    text-align: center;
    margin-bottom: 28px;
}

.logo h1 {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
}

.over {
    color: #ff7900;
}

.phone {
    color: white;
}

.logo p {
    color: #888;
    font-size: 11px;
    margin-top: 8px;
    letter-spacing: 2px;
}

label {
    display: block;
    font-size: 13px;
    color: #ccc;
    margin-bottom: 9px;
}

input, select {
    width: 100%;
    padding: 15px;
    background: #222;
    color: white;
    border: 1px solid #383838;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
    margin-bottom: 20px;
}

input:focus, select:focus {
    border-color: #ff7900;
}

.opcoes {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
}

.opcoes button {
    flex: 1;
    padding: 13px;
    background: #252525;
    color: white;
    border: 1px solid #383838;
    border-radius: 9px;
    cursor: pointer;
}

.opcoes button.ativo {
    background: #ff7900;
    color: black;
    border-color: #ff7900;
    font-weight: bold;
}

.resultado {
    background: #202020;
    padding: 20px;
    border-radius: 12px;
    margin-top: 10px;
    border: 1px solid #ff7900;
}

.resultado small {
    color: #aaa;
    letter-spacing: 1px;
}

.total {
    color: #ff7900;
    font-size: 30px;
    font-weight: bold;
    margin: 10px 0 20px;
}

.linha {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 14px 0;
    font-size: 13px;
}

.linha span:first-child {
    color: #aaa;
}

.linha span:last-child {
    font-weight: bold;
    text-align: right;
}

.divisor {
    border: 0;
    border-top: 1px solid #444;
    margin: 18px 0;
}

.valor-parcela {
    font-size: 24px;
    font-weight: bold;
    margin-top: 8px;
}

.copiar {
    width: 100%;
    padding: 15px;
    background: #ff7900;
    color: black;
    border: none;
    border-radius: 9px;
    font-weight: bold;
    margin-top: 20px;
    cursor: pointer;
}

.copiar:hover {
    background: #e66d00;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 10px;
    margin-top: 24px;
    letter-spacing: 2px;
}

.erro {
    color: #ff7900;
    font-size: 13px;
    margin-bottom: 15px;
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>
            <span class="over">OVER</span><span class="phone">PHONE</span>
        </h1>
        <p>CALCULADORA DE VENDAS</p>
    </div>

    <label>Valor da venda (R$)</label>
    <input
        type="text"
        id="valor"
        inputmode="decimal"
        placeholder="Ex: 1500,00"
        autocomplete="off"
    >

    <label>Bandeira do cartão</label>
    <select id="bandeira">
        <option value="visa">Visa e Mastercard</option>
        <option value="elo">Elo, Hiper, Amex e Outros</option>
    </select>

    <label>Forma de pagamento</label>

    <div class="opcoes">
        <button id="btnDebito" onclick="mudarForma('debito')">
            DÉBITO
        </button>

        <button id="btnCredito" class="ativo" onclick="mudarForma('credito')">
            CRÉDITO
        </button>
    </div>

    <div id="areaParcelas">
        <label>Quantidade de parcelas</label>
        <select id="parcelas"></select>
    </div>

    <div class="erro" id="erro">
        Digite um valor válido para calcular.
    </div>

    <div class="resultado" id="resultado">

        <small>VALOR TOTAL COM JUROS</small>

        <div class="total" id="total">R$ 0,00</div>

        <div class="linha">
            <span>Valor original:</span>
            <span id="original"></span>
        </div>

        <div class="linha">
            <span>Taxa aplicada:</span>
            <span id="taxa"></span>
        </div>

        <div class="linha">
            <span>Valor dos juros:</span>
            <span id="juros"></span>
        </div>

        <div class="linha">
            <span>Parcelamento:</span>
            <span id="parcelamento"></span>
        </div>

        <hr class="divisor">

        <small id="tituloParcela">VALOR DE CADA PARCELA</small>

        <div class="valor-parcela" id="parcela"></div>

        <button class="copiar" onclick="copiarResultado()">
            COPIAR RESULTADO
        </button>

    </div>

    <div class="footer">
        OVERPHONE © 2026
    </div>

</div>

<script>

const taxas = {
    visa: {
        debito: 2.49,
        credito: [
            4.49, 5.59, 6.28, 6.97, 7.64, 8.31,
            9.17, 9.83, 10.48, 11.13, 11.76, 12.40,
            13.82, 14.44, 15.06, 15.67, 16.27, 16.87
        ]
    },

    elo: {
        debito: 3.10,
        credito: [
            5.49, 6.80, 7.49, 8.18, 8.85, 9.52,
            10.97, 11.63, 12.28, 12.93, 13.56, 14.20,
            14.82, 15.44, 16.06, 16.67, 17.27, 17.87
        ]
    }
};

let forma = "credito";

const valorInput = document.getElementById("valor");
const bandeiraInput = document.getElementById("bandeira");
const parcelasInput = document.getElementById("parcelas");

function dinheiro(valor) {
    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function lerValor() {
    let texto = valorInput.value.trim();

    if (!texto) return 0;

    // Aceita valores como 1500,00 ou 1.500,00
    texto = texto.replace(/\s/g, "");

    if (texto.includes(",")) {
        texto = texto.replace(/\./g, "").replace(",", ".");
    }

    return Number(texto);
}

function preencherParcelas() {
    parcelasInput.innerHTML = "";

    for (let i = 1; i <= 18; i++) {
        const option = document.createElement("option");

        option.value = i;
        option.textContent = i + "x";

        parcelasInput.appendChild(option);
    }
}

function mudarForma(novaForma) {
    forma = novaForma;

    document.getElementById("btnDebito")
        .classList.toggle("ativo", forma === "debito");

    document.getElementById("btnCredito")
        .classList.toggle("ativo", forma === "credito");

    document.getElementById("areaParcelas").style.display =
        forma === "credito" ? "block" : "none";

    calcular();
}

function calcular() {

    const valor = lerValor();

    const tipo = bandeiraInput.value;

    const quantidade = Number(parcelasInput.value) || 1;

    const resultado = document.getElementById("resultado");
    const erro = document.getElementById("erro");

    if (!Number.isFinite(valor) || valor <= 0) {
        resultado.style.display = "none";
        erro.style.display = valorInput.value.trim() ? "block" : "none";
        return;
    }

    erro.style.display = "none";

    let taxa;

    if (forma === "debito") {
        taxa = taxas[tipo].debito;
    } else {
        taxa = taxas[tipo].credito[quantidade - 1];
    }

    const total = valor / (1 - taxa / 100);
    const juros = total - valor;

    const valorParcela = total / (
        forma === "credito" ? quantidade : 1
    );

    document.getElementById("total").textContent =
        dinheiro(total);

    document.getElementById("original").textContent =
        dinheiro(valor);

    document.getElementById("taxa").textContent =
        taxa.toFixed(2).replace(".", ",") + "%";

    document.getElementById("juros").textContent =
        dinheiro(juros);

    document.getElementById("parcelamento").textContent =
        forma === "credito" ? quantidade + "x" : "Débito à vista";

    document.getElementById("parcela").textContent =
        dinheiro(valorParcela);

    document.getElementById("tituloParcela").textContent =
        forma === "credito"
        ? "VALOR DE CADA PARCELA"
        : "VALOR NO DÉBITO";

    resultado.style.display = "block";
}

async function copiarResultado() {

    const texto = `
OVERPHONE - CALCULADORA DE VENDAS

Valor original: ${document.getElementById("original").textContent}
Taxa aplicada: ${document.getElementById("taxa").textContent}
Juros: ${document.getElementById("juros").textContent}
Parcelamento: ${document.getElementById("parcelamento").textContent}
Valor da parcela: ${document.getElementById("parcela").textContent}

TOTAL: ${document.getElementById("total").textContent}
`;

    try {
        await navigator.clipboard.writeText(texto);
        alert("Resultado copiado com sucesso!");
    } catch (erro) {
        const area = document.createElement("textarea");
        area.value = texto;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
        alert("Resultado copiado!");
    }
}

// Atualização automática
valorInput.addEventListener("input", calcular);
bandeiraInput.addEventListener("change", calcular);
parcelasInput.addEventListener("change", calcular);

// Inicialização
preencherParcelas();
calcular();

</script>

</body>
</html>
